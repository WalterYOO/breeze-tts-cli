version: 1
compiler_version: "1"

defaults:
  zh: zh-late-night-radio/v1
  en: en-podcast-host/v1

# Token -> natural-language phrase. Unknown tokens fall back to the raw value
# with underscores replaced by spaces, and `design lint` reports them.
