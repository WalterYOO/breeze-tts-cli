  zh:
    age:
      teen: 少年
      child: 儿童
      "20s": 二十多岁
      "30s": 三十多岁
      "40s": 四十多岁
      "50s": 五十多岁
      "60s": 六十多岁
      senior: 老年
    gender:
      female: 女性
      male: 男性
      neutral: 中性
    pitch:
      low: 偏低
      low_mid: 中低
      mid: 中等
      high_mid: 中高
      high: 偏高
    pace:
      slow: 缓慢
      medium_slow: 中慢
      medium: 中等
      medium_fast: 中快
      fast: 偏快
    energy:
      low: 低
      medium_low: 中低
      medium: 中等
      medium_high: 中高
      high: 高
    proximity:
      close_mic: 贴近麦克风
      mid_distance: 中等距离
      far_field: 远场
    room:
      dry_studio: 干燥的录音棚
      treated_room: 做过声学处理的房间
      natural_room: 自然房间
    timbre:
      warm: 温暖
      clean: 干净
      slightly_husky: 略带沙哑
      bright: 明亮
      dark: 偏暗
      breathy: 带气声
      nasal: 带鼻音
      smooth: 顺滑
      crisp: 清脆
      soft: 柔和
      metallic: 有金属感
      deep: 深沉
    articulation:
      clear: 清晰
      relaxed: 放松
      precise: 精准
      lazy: 慵懒
      crisp: 干净利落
      soft: 轻柔
    tone:
      calm: 平静
      intimate: 亲密
      warm: 温暖
      cool: 冷静
      playful: 俏皮
      serious: 严肃
      gentle: 温柔
      wry: 略带调侃
    persona:
      late_night_host: 深夜电台主持人
      documentary_narrator: 纪录片旁白
      anime_character: 动画角色
      podcast_host: 播客主持人
      audiobook_narrator: 有声书旁白
      game_character: 游戏角色
    avoid:
      childlike: 儿童感
      shouting: 喊叫
      robotic: 机械感
      overly_bright: 过亮
      monotone: 单调
  en:
    age:
      teen: teenage
      child: child
      "20s": in their twenties
      "30s": in their thirties
      "40s": in their forties
      "50s": in their fifties
      "60s": in their sixties
      senior: elderly
    gender:
      female: female
      male: male
      neutral: androgynous
    pitch:
      low: low
      low_mid: low-mid
      mid: mid
      high_mid: high-mid
      high: high
    pace:
      slow: slow
      medium_slow: medium-slow
      medium: medium
      medium_fast: medium-fast
      fast: fast
    energy:
      low: low
      medium_low: medium-low
      medium: medium
      medium_high: medium-high
      high: high
    proximity:
      close_mic: close-mic
      mid_distance: mid-distance
      far_field: far-field
    room:
      dry_studio: dry studio
      treated_room: treated room
      natural_room: natural room
    timbre:
      warm: warm
      clean: clean
      slightly_husky: slightly husky
      bright: bright
      dark: dark
      breathy: breathy
      nasal: nasal
      smooth: smooth
      crisp: crisp
      soft: soft
      metallic: metallic
      deep: deep
    articulation:
      clear: clear
      relaxed: relaxed
      precise: precise
      lazy: lazy
      crisp: crisp
      soft: soft
    tone:
      calm: calm
      intimate: intimate
      warm: warm
      cool: cool
      playful: playful
      serious: serious
      gentle: gentle
      wry: wry
    persona:
      late_night_host: late-night radio host
      documentary_narrator: documentary narrator
      anime_character: animation character
      podcast_host: podcast host
      audiobook_narrator: audiobook narrator
      game_character: game character
    avoid:
      childlike: childlike
      shouting: shouting
      robotic: robotic
