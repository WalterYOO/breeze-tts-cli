templates:
  zh-late-night-radio/v1:
    language: zh
    label: 深夜电台
    description: 近距离、低能量、亲密语气的深夜主持人声线。
    render: >-
      {% if identity.age or identity.gender %}用{{ identity.age }}{{ identity.gender }}的声线说话。{% endif %}
      {% if identity.timbre %}音色{{ identity.timbre }}。{% endif %}
      {% if identity.pitch %}音高{{ identity.pitch }}。{% endif %}
      {% if identity.articulation %}吐字{{ identity.articulation }}。{% endif %}
      {% if identity.persona %}人物气质接近{{ identity.persona }}。{% endif %}
      {% if delivery.pace or delivery.energy or delivery.tone %}{% if delivery.pace %}语速{{ delivery.pace }}{% endif %}{% if delivery.energy %}{% if delivery.pace %}，{% endif %}能量{{ delivery.energy }}{% endif %}{% if delivery.tone %}{% if delivery.pace or delivery.energy %}，{% endif %}语气{{ delivery.tone }}{% endif %}。{% endif %}
      {% if scene.proximity %}声音{{ scene.proximity }}。{% endif %}
      {% if scene.room %}环境是{{ scene.room }}。{% endif %}
      {% if avoid %}避免{{ avoid }}。{% endif %}
    default_covers:
      - 晚上好，欢迎收听今天的节目。
      - 外面下着雨，我们慢慢聊。
    starter:
      identity:
        age: 30s
        gender_presentation: female
        timbre: [warm, clean, slightly_husky]
        pitch: low_mid
        articulation: clear, relaxed
        persona: late_night_host
      delivery_baseline:
        pace: medium_slow
        energy: medium_low
        tone: calm, intimate
      scene:
        proximity: close_mic
        room: dry_studio
      avoid: [childlike, shouting]
      covers:
        - 晚上好，欢迎收听今天的节目。
        - 外面下着雨，我们慢慢聊。

  zh-documentary-narrator/v1:
    language: zh
    label: 纪录片旁白
    description: 沉稳、克制、信息密度高的纪录片旁白。
    render: >-
      {% if identity.age or identity.gender %}{{ identity.age }}{{ identity.gender }}声线。{% endif %}
      {% if identity.pitch %}音高{{ identity.pitch }}。{% endif %}
      {% if identity.timbre %}音色{{ identity.timbre }}。{% endif %}
      {% if identity.articulation %}吐字{{ identity.articulation }}。{% endif %}
      {% if identity.persona %}气质是{{ identity.persona }}。{% endif %}
      {% if delivery.pace or delivery.energy or delivery.tone %}{% if delivery.pace %}语速{{ delivery.pace }}{% endif %}{% if delivery.energy %}{% if delivery.pace %}，{% endif %}能量{{ delivery.energy }}{% endif %}{% if delivery.tone %}{% if delivery.pace or delivery.energy %}，{% endif %}语气{{ delivery.tone }}{% endif %}。{% endif %}
      {% if scene.proximity %}声音{{ scene.proximity }}。{% endif %}
      {% if scene.room %}环境是{{ scene.room }}。{% endif %}
      {% if avoid %}避免{{ avoid }}。{% endif %}
    default_covers:
      - 这片土地已经沉睡了千年。
      - 风从山谷里吹来，带着雪的味道。
    starter:
      identity:
        age: 40s
        gender_presentation: male
        timbre: [deep, smooth]
        pitch: low
        articulation: precise
        persona: documentary_narrator
      delivery_baseline:
        pace: slow
        energy: low
        tone: serious
      scene:
        proximity: close_mic
        room: dry_studio
      avoid: [childlike, overly_bright]
      covers:
        - 这片土地已经沉睡了千年。
        - 风从山谷里吹来，带着雪的味道。

  zh-anime-character/v1:
    language: zh
    label: 动画角色
    description: 明亮、有起伏的动画角色声线。
    render: >-
      {% if identity.age or identity.gender %}{{ identity.age }}{{ identity.gender }}角色声线。{% endif %}
      {% if identity.pitch %}音高{{ identity.pitch }}。{% endif %}
      {% if identity.timbre %}音色{{ identity.timbre }}。{% endif %}
      {% if identity.articulation %}吐字{{ identity.articulation }}。{% endif %}
      {% if identity.persona %}性格气质是{{ identity.persona }}。{% endif %}
      {% if delivery.pace or delivery.energy or delivery.tone %}{% if delivery.pace %}语速{{ delivery.pace }}{% endif %}{% if delivery.energy %}{% if delivery.pace %}，{% endif %}能量{{ delivery.energy }}{% endif %}{% if delivery.tone %}{% if delivery.pace or delivery.energy %}，{% endif %}语气{{ delivery.tone }}{% endif %}。{% endif %}
      {% if scene.proximity %}声音{{ scene.proximity }}。{% endif %}
      {% if scene.room %}环境是{{ scene.room }}。{% endif %}
      {% if avoid %}不要{{ avoid }}。{% endif %}
    default_covers:
      - 你终于来了，我等你好久了。
      - 别担心，我会一直在你身边。
    starter:
      identity:
        age: 20s
        gender_presentation: female
        timbre: [bright, clean]
        pitch: high_mid
        articulation: crisp
        persona: anime_character
      delivery_baseline:
        pace: medium_fast
        energy: medium_high
        tone: playful
      scene:
        proximity: close_mic
        room: dry_studio
      avoid: [robotic, monotone]
      covers:
        - 你终于来了，我等你好久了。
        - 别担心，我会一直在你身边。

  en-podcast-host/v1:
    language: en
    label: Podcast host
    description: Warm, conversational close-mic podcast delivery.
    render: >-
      {% if identity.age or identity.gender %}A {{ identity.gender }} voice{% if identity.age %} {{ identity.age }}{% endif %}.{% endif %}
      {% if identity.timbre %} Timbre: {{ identity.timbre }}.{% endif %}
      {% if identity.pitch %} Pitch: {{ identity.pitch }}.{% endif %}
      {% if identity.articulation %} Articulation: {{ identity.articulation }}.{% endif %}
      {% if identity.persona %} Persona: {{ identity.persona }}.{% endif %}
      {% if delivery.pace or delivery.energy or delivery.tone %} Delivery:{% if delivery.pace %} pace {{ delivery.pace }}{% endif %}{% if delivery.energy %}{% if delivery.pace %},{% endif %} energy {{ delivery.energy }}{% endif %}{% if delivery.tone %}{% if delivery.pace or delivery.energy %},{% endif %} tone {{ delivery.tone }}{% endif %}.{% endif %}
      {% if scene.proximity %} Recorded {{ scene.proximity }}.{% endif %}
      {% if scene.room %} Room: {{ scene.room }}.{% endif %}
      {% if avoid %} Avoid {{ avoid }}.{% endif %}
    default_covers:
      - Welcome back to the show.
      - Let's take a moment and slow down.
    starter:
      identity:
        age: 30s
        gender_presentation: female
        timbre: [warm, breathy]
        pitch: low_mid
        articulation: relaxed
        persona: podcast_host
      delivery_baseline:
        pace: medium
        energy: medium_low
        tone: intimate
      scene:
        proximity: close_mic
        room: treated_room
      avoid: [shouting, robotic]
      covers:
        - Welcome back to the show.
        - Let's take a moment and slow down.

  en-audiobook-narrator/v1:
    language: en
    label: Audiobook narrator
    description: Controlled, low-energy narration for long-form reading.
    render: >-
      {% if identity.age or identity.gender %}A {{ identity.gender }} voice{% if identity.age %} {{ identity.age }}{% endif %}.{% endif %}
      {% if identity.pitch %} Pitch: {{ identity.pitch }}.{% endif %}
      {% if identity.timbre %} Timbre: {{ identity.timbre }}.{% endif %}
      {% if identity.articulation %} Articulation: {{ identity.articulation }}.{% endif %}
      {% if identity.persona %} Persona: {{ identity.persona }}.{% endif %}
      {% if delivery.pace or delivery.energy or delivery.tone %} Delivery:{% if delivery.pace %} pace {{ delivery.pace }}{% endif %}{% if delivery.energy %}{% if delivery.pace %},{% endif %} energy {{ delivery.energy }}{% endif %}{% if delivery.tone %}{% if delivery.pace or delivery.energy %},{% endif %} tone {{ delivery.tone }}{% endif %}.{% endif %}
      {% if scene.proximity %} Recorded {{ scene.proximity }}.{% endif %}
      {% if scene.room %} Room: {{ scene.room }}.{% endif %}
      {% if avoid %} Avoid {{ avoid }}.{% endif %}
    default_covers:
      - The house stood silent at the end of the lane.
      - She had not spoken to him in years.
    starter:
      identity:
        age: 40s
        gender_presentation: male
        timbre: [deep, smooth]
        pitch: low
        articulation: precise
        persona: audiobook_narrator
      delivery_baseline:
        pace: slow
        energy: low
        tone: calm
      scene:
        proximity: close_mic
        room: dry_studio
      avoid: [childlike, shouting]
      covers:
        - The house stood silent at the end of the lane.
        - She had not spoken to him in years.

  en-game-character/v1:
    language: en
    label: Game character
    description: Bright, energetic character voice for games and animation.
    render: >-
      {% if identity.age or identity.gender %}A {{ identity.gender }} character voice{% if identity.age %} {{ identity.age }}{% endif %}.{% endif %}
      {% if identity.pitch %} Pitch: {{ identity.pitch }}.{% endif %}
      {% if identity.timbre %} Timbre: {{ identity.timbre }}.{% endif %}
      {% if identity.articulation %} Articulation: {{ identity.articulation }}.{% endif %}
      {% if identity.persona %} Personality: {{ identity.persona }}.{% endif %}
      {% if delivery.pace or delivery.energy or delivery.tone %} Delivery:{% if delivery.pace %} pace {{ delivery.pace }}{% endif %}{% if delivery.energy %}{% if delivery.pace %},{% endif %} energy {{ delivery.energy }}{% endif %}{% if delivery.tone %}{% if delivery.pace or delivery.energy %},{% endif %} tone {{ delivery.tone }}{% endif %}.{% endif %}
      {% if scene.proximity %} Recorded {{ scene.proximity }}.{% endif %}
      {% if scene.room %} Room: {{ scene.room }}.{% endif %}
      {% if avoid %} Do not sound {{ avoid }}.{% endif %}
    default_covers:
      - You made it. I was starting to worry.
      - Stay close. This place is not safe.
    starter:
      identity:
        age: 20s
        gender_presentation: neutral
        timbre: [bright, crisp]
        pitch: high_mid
        articulation: crisp
        persona: game_character
      delivery_baseline:
        pace: medium_fast
        energy: medium_high
        tone: playful
      scene:
        proximity: mid_distance
        room: natural_room
      avoid: [monotone, robotic]
      covers:
        - You made it. I was starting to worry.
        - Stay close. This place is not safe.
